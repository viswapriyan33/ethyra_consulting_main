<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boy Push Intro Prototype</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070b16;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Landing Page Mock */
    .mock-site {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: radial-gradient(circle at 50% 30%, #0f1934 0%, #070b16 70%);
      text-align: center;
    }

    .mock-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(0, 154, 224, 0.12);
      border: 1px solid rgba(0, 154, 224, 0.3);
      border-radius: 999px;
      color: #009ae0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .mock-title {
      font-size: clamp(32px, 5vw, 64px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      background: linear-gradient(180deg, #ffffff 40%, rgba(255,255,255,0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      max-width: 800px;
      margin-bottom: 20px;
    }

    .mock-desc {
      font-size: clamp(16px, 1.6vw, 20px);
      color: rgba(255, 255, 255, 0.7);
      max-width: 620px;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .dev-controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000000;
      display: flex;
      gap: 12px;
      align-items: center;
      background: rgba(10, 16, 30, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 24px;
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .mock-btn {
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 600;
      background: #009ae0;
      color: #ffffff;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 154, 224, 0.3);
      transition: transform 0.2s;
    }
    .mock-btn:hover {
      transform: scale(1.04);
    }

    /* ==========================================================================
       BOY PUSH INTRO CURTAIN SYSTEM
       ========================================================================== */
    .boy-intro-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999999;
      pointer-events: auto;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* The moving black curtain panel */
    .boy-curtain-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      /* Tactile physical paper/curtain leading edge */
      box-shadow: -14px 0 40px rgba(0, 0, 0, 0.85), -2px 0 0 rgba(255, 255, 255, 0.2);
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }

    /* Vertical edge highlight line */
    .boy-curtain-edge-line {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0.02) 100%);
      pointer-events: none;
    }

    /* Boy character anchor pinned to the LEFT edge of the curtain, walking on bottom/taskbar */
    .boy-character-anchor {
      position: absolute;
      bottom: 0;
      right: 100%;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      z-index: 10;
      overflow: visible;
      will-change: transform;
    }

    .boy-character-sprite {
      height: clamp(260px, 46vh, 500px);
      width: auto;
      display: block;
      /* Palms touch the edge of the curtain */
      margin-right: -10px;
      margin-bottom: 0;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(-8px 12px 24px rgba(0, 0, 0, 0.4));
    }

    .curtain-welcome-wrap {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      pointer-events: none;
      user-select: none;
      text-align: center;
      z-index: 5;
      width: 90%;
      max-width: 760px;
    }

    .curtain-welcome-sub {
      font-size: clamp(18px, 2.3vw, 28px);
      font-weight: 700;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.95);
      margin-left: 0.38em;
      text-shadow: 0 2px 24px rgba(0, 154, 224, 0.45);
    }

    .curtain-welcome-logo {
      width: 100%;
      max-width: clamp(360px, 42vw, 580px);
      height: auto;
      display: block;
      filter: drop-shadow(0 6px 32px rgba(0, 154, 224, 0.4));
    }

    /* Controls: Skip & Sound */
    .boy-intro-controls {
      position: absolute;
      top: 24px;
      right: 28px;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .boy-intro-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(255, 255, 255, 0.85);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 8px 18px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .boy-intro-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <!-- Landing Page Background Content -->
  <main class="mock-site">
    <div class="mock-badge">Ethyra Consulting Services</div>
    <h1 class="mock-title">Good intentions are a start.<br>The real question is, what changed?</h1>
    <p class="mock-desc">We help organisations design stronger social programmes, understand what works, and assess the difference their social investments make.</p>
    
    <div class="dev-controls">
      <button class="mock-btn" id="replayBtn" onclick="runBoyIntro()">Replay Intro Animation ↺</button>
      <button class="mock-btn" style="background: rgba(255,255,255,0.1);" onclick="setCurtainProgress(0.15)">15%</button>
      <button class="mock-btn" style="background: rgba(255,255,255,0.1);" onclick="setCurtainProgress(0.50)">50%</button>
      <button class="mock-btn" style="background: rgba(255,255,255,0.1);" onclick="setCurtainProgress(0.85)">85%</button>
    </div>
  </main>

  <!-- Boy Push Intro Overlay Component -->
  <div class="boy-intro-overlay" id="boyIntroOverlay">
    <div class="boy-curtain-panel" id="boyCurtain">
      <div class="boy-curtain-edge-line" aria-hidden="true"></div>
      
      <!-- Welcome Greeting on Black Curtain -->
      <div class="curtain-welcome-wrap" id="curtainWelcome">
        <div class="curtain-welcome-sub">WELCOME TO</div>
        <img src="assets/clean_ethyra_logo.png" class="curtain-welcome-logo" alt="Ethyra Logo">
      </div>

      <!-- Straining Boy Character pinned to left edge of curtain -->
      <div class="boy-character-anchor" id="boyAnchor">
        <img src="assets/boy-push.webp?v=4.0" class="boy-character-sprite" id="boySprite" alt="Boy pushing curtain">
      </div>

      <!-- Top Controls -->
      <div class="boy-intro-controls">
        <button class="boy-intro-btn" id="boySkipBtn" onclick="skipBoyIntro()">
          Skip
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="2" y1="8" x2="14" y2="8"></line>
            <polyline points="9 3 14 8 9 13"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- GSAP for Butter-Smooth Animation -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    let introTl = null;

    function buildTimeline() {
      const curtain = document.getElementById('boyCurtain');
      const welcome = document.getElementById('curtainWelcome');
      const screenW = window.innerWidth;
      const totalDist = screenW + 500;

      if (introTl) introTl.kill();

      introTl = gsap.timeline({
        paused: true,
        onComplete: () => {
          const overlay = document.getElementById('boyIntroOverlay');
          gsap.to(overlay, {
            opacity: 0,
            duration: 0.35,
            ease: 'power2.out',
            onComplete: () => {
              overlay.style.display = 'none';
              overlay.style.pointerEvents = 'none';
            }
          });
        }
      });

      // Cinematic 10-Second Physical Push Choreography (Total duration = 10.0s):
      introTl
        .set(curtain, { x: 0 });

      if (welcome) {
        introTl.set(welcome, { opacity: 1 });
      }

      introTl
        .to({}, { duration: 0.4 })
        .to(curtain, {
          x: screenW * 0.28,
          duration: 2.8,
          ease: 'power1.inOut'
        });

      introTl
        .to(curtain, {
          x: screenW * 0.38,
          duration: 1.2,
          ease: 'sine.inOut'
        })
        .to(curtain, {
          x: screenW * 0.78,
          duration: 3.4,
          ease: 'power1.inOut'
        })
        .to(curtain, {
          x: totalDist,
          duration: 2.2,
          ease: 'power2.inOut'
        });

      return introTl;
    }

    function runBoyIntro() {
      const overlay = document.getElementById('boyIntroOverlay');
      const welcome = document.getElementById('curtainWelcome');
      overlay.style.display = 'block';
      overlay.style.pointerEvents = 'auto';
      overlay.style.opacity = '1';
      if (welcome) gsap.set(welcome, { opacity: 1 });

      const tl = buildTimeline();
      tl.restart();
    }

    function setCurtainProgress(p) {
      const overlay = document.getElementById('boyIntroOverlay');
      const welcome = document.getElementById('curtainWelcome');
      overlay.style.display = 'block';
      overlay.style.pointerEvents = 'auto';
      overlay.style.opacity = '1';
      if (welcome) gsap.set(welcome, { opacity: 1 });

      const tl = buildTimeline();
      tl.progress(p);
    }

    function skipBoyIntro() {
      if (introTl) introTl.kill();
      const overlay = document.getElementById('boyIntroOverlay');
      const curtain = document.getElementById('boyCurtain');
      const screenW = window.innerWidth;

      gsap.to(curtain, {
        x: screenW + 500,
        duration: 0.45,
        ease: 'power3.out',
        onComplete: () => {
          overlay.style.display = 'none';
          overlay.style.pointerEvents = 'none';
        }
      });
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') skipBoyIntro();
    });

    window.addEventListener('DOMContentLoaded', () => {
      runBoyIntro();
    });
  </script>
</body>
</html>
